  <main class="content-view runtime-view main-view" id="view-runtime" hidden>
    <section class="event-lab">
        <div class="harness-source">
          <button class="icon-action labeled" id="harness-use-project"><i data-icon="rotate-ccw" data-size="14"></i> Use current project</button>
          <button class="icon-action labeled" id="harness-load-file"><i data-icon="folder-open" data-size="14"></i> Load .score.js file</button>
          <input type="file" id="harness-file" accept=".js,text/javascript" hidden />
          <span id="harness-source-label">No score loaded</span>
        </div>
        <div class="event-stage">
          <div class="world-orbit">
            <div class="orbit-core" id="orbit-core"></div>
            <div class="harness-readout">
              <span class="harness-stat"><small>BAR</small><strong id="harness-bar">—</strong></span>
              <span class="harness-stat"><small>VERSE</small><strong id="harness-verse">—</strong></span>
              <span class="axis-meters" id="harness-axes" title="Live reactive axes"></span>
            </div>
          </div>
          <div class="harness-controls">
            <div class="harness-transport">
              <button class="event-button" id="harness-start" disabled>Start</button>
              <button class="event-button" id="harness-stop" disabled>Stop</button>
              <button class="event-button" id="harness-dispose" disabled>Dispose</button>
            </div>
            <label class="harness-state-row" title="Feeds setGameMusicState — the same call your game makes every frame">
              <span>Threat</span>
              <input type="range" min="0" max="100" value="0" id="harness-threat" />
              <strong id="harness-threat-value">0%</strong>
            </label>
            <label class="harness-state-row" title="Feeds setGameMusicState({ inCombat: true })">
              <span>In combat</span>
              <input type="checkbox" id="harness-combat" />
            </label>
            <div class="harness-flourish-row" title="One-shot flourish calls; each plays across the next bar and resolves its context">
              <span>musicEvent</span>
              <div id="harness-flourishes"></div>
            </div>
            <div class="harness-flourish-row" title="setGameAxes — manual axis targets; eased in at bar boundaries instead of the context's targets until cleared">
              <span>setGameAxes</span>
              <div class="harness-axes-override" id="harness-axes-override">
                <label><span>Int</span><input type="range" min="0" max="100" value="50" data-harness-axis="intensity" /></label>
                <label><span>Ten</span><input type="range" min="0" max="100" value="50" data-harness-axis="tension" /></label>
                <label><span>Bri</span><input type="range" min="0" max="100" value="50" data-harness-axis="brightness" /></label>
                <button type="button" class="event-button" id="harness-axes-clear">Follow context</button>
              </div>
            </div>
          </div>
        </div>
        <div class="code-block harness-log-block">
          <div class="code-heading"><span>API call log</span></div>
          <div class="harness-log" id="harness-log"></div>
        </div>
    </section>
  </main>
